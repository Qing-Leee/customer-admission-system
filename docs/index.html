<script>
// ======================================================================
// 评分引擎 — 纯前端实现（完全还原后端 Python 逻辑）
// ======================================================================

// --- 维度规则 ---
const ALL_DIMENSIONS=['subject_quality','financial','project_quality','performance_quality'];
const DIMENSION_MAP={
  'FIRST|false':['subject_quality'],
  'FIRST|true':['subject_quality','financial','project_quality'],
  'DYNAMIC|false':['subject_quality','performance_quality'],
  'DYNAMIC|true':['subject_quality','financial','performance_quality']
};
function activeDimensions(scenario,isCredit){
  return DIMENSION_MAP[scenario+'|'+isCredit]||[];
}

// --- 评级映射 ---
const RATING_THRESHOLDS=[
  [90,null,'AAA',0.50],[80,90,'AA',0.70],[70,80,'A',0.85],
  [60,70,'BBB',1.00],[50,60,'BB',1.20],[40,50,'B',1.50],[0,40,'UNQUALIFIED',2.00]
];
function mapRating(totalScore){
  let s=Number(totalScore)||0;
  for(let [lo,hi,r,co] of RATING_THRESHOLDS){
    if(hi===null&&s>=lo)return[r,co];
    if(lo<=s&&s<hi)return[r,co];
  }
  return['UNQUALIFIED',2.00];
}

// --- 安全除法 ---
function safeDiv(a,b){return b===0?0:a/b;}

// --- 财务比率计算 ---
function computeRatios(d){
  let ta=+(d.total_asset||0),tl=+(d.total_liability||0),ca=+(d.current_asset||0);
  let cl=+(d.current_liability||0),rev=+(d.revenue||0),np=+(d.net_profit||0);
  let inv=+(d.inventory||0),pp=+(d.prepay||0),ocf=+(d.operating_cash_flow||0),na=+(d.net_asset||0);
  return{
    asset_liability_ratio:safeDiv(tl,ta),
    quick_ratio:safeDiv(ca-inv-pp,cl),
    cash_flow_ratio:safeDiv(ocf,cl),
    net_profit_margin:safeDiv(np,rev),
    roe:safeDiv(np,na),
    asset_turnover_ratio:safeDiv(rev,ta),
    capital_operation_capability:safeDiv(na,ta)
  };
}

// --- 指标值解析 ---
function resolveIndicator(code,ctx){
  const{ratios,project_quality:pq,performance:perf,profile:p}=ctx;
  // 主体资质
  const subCodes={registered_capital:1,paid_in_ratio:1,establish_years:1,tax_completion:1,defendant_ratio:1,executed_ratio:1,executed_amount_ratio:1,bank_flow_ratio:1};
  if(subCodes[code]){
    if(!p)return null;
    switch(code){
      case'registered_capital':return+p.registered_capital;
      case'paid_in_ratio':return p.registered_capital==0?0:+p.paid_in_capital/+p.registered_capital;
      case'establish_years':{let y=parseInt((p.establish_date||'').substring(0,4));return isNaN(y)?null:new Date().getFullYear()-y;}
      case'tax_completion':return+p.tax_completion_status;
      case'defendant_ratio':return+p.defendant_count/Math.max(+p.lawsuit_total,1);
      case'executed_ratio':return+p.executed_count/Math.max(+p.lawsuit_total,1);
      case'executed_amount_ratio':return+p.executed_amount/Math.max(+p.paid_in_capital,1);
      case'bank_flow_ratio':return+p.avg_bank_flow/Math.max(+p.avg_approved_fund,1);
    }
  }
  // 财务
  const finMap={asset_liability_ratio:'asset_liability_ratio',quick_ratio:'quick_ratio',cash_flow_ratio:'cash_flow_ratio',net_profit_margin:'net_profit_margin',roe:'roe',asset_turnover_ratio:'asset_turnover_ratio',capital_operation:'capital_operation_capability'};
  if(finMap[code]){return ratios?+(ratios[finMap[code]]??0):null;}
  // 立项质量
  const projMap={avg_gross_margin:'avg_gross_margin',price_volatility:'price_volatility',contract_terms_score:'contract_terms_score',legal_opinion_score:'legal_opinion_adoption',warehouse_control_score:'warehouse_control_score',logistics_track_score:'logistics_track_score'};
  if(projMap[code]){return pq?+(pq[projMap[code]]??0):null;}
  // 履约质量
  if(perf){
    switch(code){
      case'annual_gross_margin':return+perf.annual_gross_margin;
      case'annual_revenue':return+perf.annual_revenue;
      case'immediate_overdue_rate':return+perf.immediate_overdue_project_count/Math.max(+perf.total_project_count,1);
      case'overdue_60days_rate':return+perf.overdue_60days_batch_count/Math.max(+perf.total_batch_count,1);
      case'recovery_rate':return+perf.recovered_amount/Math.max(+perf.historical_overdue_amount,1);
      case'tax_declaration_consistency':return+perf.tax_declaration_diff;
    }
  }
  return null;
}

// --- 阶梯计分 ---
function scoreIndicator(value,segments){
  if(value===null||value===undefined)return 0;
  let matched=null;
  for(let seg of segments){
    let upper=seg.upper_limit===null?Infinity:seg.upper_limit;
    if(seg.lower_limit<=value&&value<upper){matched=seg;break;}
  }
  if(!matched)return 0;
  if(matched.unit_value===0||matched.unit_value===null)return 0;
  let unitCount=(value-matched.lower_limit)/matched.unit_value;
  let rawScore=unitCount*matched.unit_score;
  return Math.min(rawScore,matched.max_score);
}

function scoreDimension(indicatorValues,indicatorSegments,active){
  if(!active)return 0;
  let total=0;
  for(let code in indicatorSegments){
    let segs=indicatorSegments[code];
    let val=indicatorValues[code];
    let score=scoreIndicator(val,segs);
    let weight=segs[0]?segs[0].weight_in_parent:0;
    total+=score*weight;
  }
  return total;
}

// --- 维度权重配置 ---
const WEIGHT_CONFIG={subject_quality:0.25,financial:0.30,project_quality:0.20,performance_quality:0.25};

// --- 指标阶梯配置（完全还原 seed_data.py）---
const INDICATOR_CONFIG={
  subject_quality:{
    registered_capital:[{lower_limit:0,upper_limit:null,unit_value:50000,unit_score:1,max_score:100,weight_in_parent:0.125}],
    paid_in_ratio:[{lower_limit:0,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.125}],
    establish_years:[{lower_limit:0,upper_limit:null,unit_value:0.1,unit_score:1,max_score:100,weight_in_parent:0.125}],
    tax_completion:[{lower_limit:0,upper_limit:null,unit_value:1,unit_score:1,max_score:100,weight_in_parent:0.125}],
    defendant_ratio:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.125}],
    executed_ratio:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.125}],
    executed_amount_ratio:[{lower_limit:-1,upper_limit:null,unit_value:1,unit_score:1,max_score:100,weight_in_parent:0.125}],
    bank_flow_ratio:[{lower_limit:0,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.125}]
  },
  financial:{
    asset_liability_ratio:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    quick_ratio:[{lower_limit:0,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    cash_flow_ratio:[{lower_limit:0,upper_limit:null,unit_value:0.005,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    net_profit_margin:[{lower_limit:0,upper_limit:null,unit_value:0.001,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    roe:[{lower_limit:0,upper_limit:null,unit_value:0.001,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    asset_turnover_ratio:[{lower_limit:0,upper_limit:null,unit_value:0.005,unit_score:1,max_score:100,weight_in_parent:0.1429}],
    capital_operation:[{lower_limit:0,upper_limit:null,unit_value:0.005,unit_score:1,max_score:100,weight_in_parent:0.1429}]
  },
  project_quality:{
    avg_gross_margin:[{lower_limit:0,upper_limit:null,unit_value:0.001,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    price_volatility:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    contract_terms_score:[{lower_limit:0,upper_limit:null,unit_value:0.5,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    legal_opinion_score:[{lower_limit:0,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    warehouse_control_score:[{lower_limit:0,upper_limit:null,unit_value:0.5,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    logistics_track_score:[{lower_limit:0,upper_limit:null,unit_value:0.5,unit_score:1,max_score:100,weight_in_parent:0.1667}]
  },
  performance_quality:{
    annual_gross_margin:[{lower_limit:0,upper_limit:null,unit_value:0.001,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    annual_revenue:[{lower_limit:0,upper_limit:null,unit_value:100000,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    immediate_overdue_rate:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    overdue_60days_rate:[{lower_limit:-1,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    recovery_rate:[{lower_limit:0,upper_limit:null,unit_value:0.01,unit_score:1,max_score:100,weight_in_parent:0.1667}],
    tax_declaration_consistency:[{lower_limit:-1,upper_limit:null,unit_value:1,unit_score:1,max_score:100,weight_in_parent:0.1667}]
  }
};

// --- 评分引擎核心 ---
function calculateScore(merchantId){
  let db=getDB();
  let merchant=db.merchants.find(m=>m.merchant_id===merchantId);
  if(!merchant)throw new Error('客商不存在');
  
  let profile={
    registered_capital:merchant.registered_capital,
    paid_in_capital:merchant.paid_in_capital,
    establish_date:merchant.establish_date,
    tax_completion_status:merchant.tax_completion_status,
    lawsuit_total:merchant.lawsuit_total,
    defendant_count:merchant.defendant_count,
    executed_count:merchant.executed_count,
    executed_amount:merchant.executed_amount,
    avg_bank_flow:merchant.avg_bank_flow,
    avg_approved_fund:merchant.avg_approved_fund
  };
  
  let finData=db.financial.filter(f=>f.merchant_id===merchantId)
    .sort((a,b)=>b.period_year-a.period_year||b.period_quarter-a.period_quarter);
  
  let rawFin=null,ratios=null;
  if(finData.length>0){
    rawFin=finData[0];
    ratios=computeRatios(rawFin);
  }
  
  let isCredit=rawFin!==null;
  let scenario=db.snapshots.some(s=>s.merchant_id===merchantId)?'DYNAMIC':'FIRST';
  let activeDims=activeDimensions(scenario,isCredit);
  
  let projectQuality=null;
  if(isCredit){
    projectQuality={avg_gross_margin:0.30,price_volatility:0.15,contract_terms_score:80,legal_opinion_adoption:0.85,warehouse_control_score:75,logistics_track_score:80};
  }
  
  let performance=null;
  
  let ctx={ratios,project_quality:projectQuality,performance:performance,profile};
  
  let dimScores={};
  for(let dim of ALL_DIMENSIONS){
    let active=activeDims.includes(dim);
    let segs=INDICATOR_CONFIG[dim]||{};
    let vals={};
    for(let code in segs){vals[code]=resolveIndicator(code,ctx);}
    dimScores[dim]=Math.round(scoreDimension(vals,segs,active)*100)/100;
  }
  
  let totalScore=0;
  for(let dim of activeDims){
    totalScore+=dimScores[dim]*(WEIGHT_CONFIG[dim]||0);
  }
  totalScore=Math.round(totalScore*100)/100;
  
  let[rating,riskCo]=mapRating(totalScore);
  let qualified=rating!=='UNQUALIFIED';
  
  return{merchant_id:merchantId,scenario,is_credit_applied:isCredit,
    dimension_scores:dimScores,total_score:totalScore,rating,risk_coefficient:riskCo,qualified};
}

// ======================================================================
// 审批工作流 — 纯前端实现
// ======================================================================
const STATUS={PENDING_DEPT:'pending_dept',PARALLEL:'parallel_signing',FINAL:'final_signing',APPROVED:'approved',REJECTED:'rejected'};
const STEP_MAP={pending_dept:'部门负责人复核',parallel_signing:'市场/法务/财务并行会签',final_signing:'公司领导终审',approved:'审批通过',rejected:'审批驳回'};
const PARALLEL_ROLES=['market','compliance','finance'];
const ROLE_MAP={'业务员小王':'业务员','部门负责人':'dept_head','市场部审批人':'market','法务部审批人':'compliance','财务部审批人':'finance','公司领导':'executive'};
const ROLE_LABELS={dept_head:'部门负责人',market:'市场部',compliance:'法务部',finance:'财务部',executive:'公司领导'};

function submitApproval(merchantId,applicant,remark){
  let db=getDB();
  let active=db.orders.filter(o=>o.merchant_id===merchantId&&[STATUS.PENDING_DEPT,STATUS.PARALLEL,STATUS.FINAL].includes(o.status));
  if(active.length>0)return{success:false,error:'该客商已有进行中的审批单，不可重复提交'};
  
  let result=calculateScore(merchantId);
  if(!result.qualified)return{success:false,error:'评分不合格，不允许提交审批',total_score:result.total_score,rating:result.rating};
  
  let orderId=db.nextOrderId++;
  let now=new Date().toLocaleString('zh-CN',{hour12:false});
  db.orders.push({
    id:orderId,merchant_id:merchantId,applicant,apply_time:now,
    status:STATUS.PENDING_DEPT,current_step:STEP_MAP[STATUS.PENDING_DEPT],
    total_score:result.total_score,rating:result.rating,
    dimension_scores:JSON.stringify(result.dimension_scores),
    remark:remark||'',updated_at:now
  });
  db.tasks.push({id:db.nextTaskId++,order_id:orderId,assignee:'部门负责人',role_type:'dept_head',action:null,comment:null,task_status:'pending',created_at:now});
  saveDB(db);
  return{success:true,order_id:orderId,total_score:result.total_score,rating:result.rating,message:'审批已提交，等待部门负责人复核'};
}

function approveTask(taskId,assignee,comment){
  let db=getDB();
  let task=db.tasks.find(t=>t.id===taskId);
  if(!task)return{success:false,error:'任务不存在'};
  if(task.assignee!==assignee)return{success:false,error:'任务归属不匹配，无权处理'};
  if(task.task_status!=='pending')return{success:false,error:'任务当前状态为'+task.task_status+'，无法处理'};
  
  let order=db.orders.find(o=>o.id===task.order_id);
  if(!order)return{success:false,error:'审批单不存在'};
  let now=new Date().toLocaleString('zh-CN',{hour12:false});
  task.action='approve';task.comment=comment||'';task.task_status='done';task.handled_at=now;
  
  if(task.role_type==='dept_head'){
    order.status=STATUS.PARALLEL;order.current_step=STEP_MAP[STATUS.PARALLEL];order.updated_at=now;
    db.tasks.push({id:db.nextTaskId++,order_id:order.id,assignee:'市场部审批人',role_type:'market',action:null,comment:null,task_status:'pending',created_at:now});
    db.tasks.push({id:db.nextTaskId++,order_id:order.id,assignee:'法务部审批人',role_type:'compliance',action:null,comment:null,task_status:'pending',created_at:now});
    db.tasks.push({id:db.nextTaskId++,order_id:order.id,assignee:'财务部审批人',role_type:'finance',action:null,comment:null,task_status:'pending',created_at:now});
    saveDB(db);
    return{success:true,order_id:order.id,message:'部门负责人复核通过，已进入市场/法务/财务并行会签'};
  }
  
  if(PARALLEL_ROLES.includes(task.role_type)){
    let parallelTasks=db.tasks.filter(t=>t.order_id===order.id&&PARALLEL_ROLES.includes(t.role_type));
    let allDone=parallelTasks.every(t=>t.task_status==='done');
    if(allDone){
      order.status=STATUS.FINAL;order.current_step=STEP_MAP[STATUS.FINAL];order.updated_at=now;
      db.tasks.push({id:db.nextTaskId++,order_id:order.id,assignee:'公司领导',role_type:'executive',action:null,comment:null,task_status:'pending',created_at:now});
      saveDB(db);
      return{success:true,order_id:order.id,all_parallel_done:true,message:'所有并行会签已通过，已进入公司领导终审'};
    }
    saveDB(db);
    return{success:true,order_id:order.id,all_parallel_done:false,message:ROLE_LABELS[task.role_type]+'会签通过，等待其他角色审批'};
  }
  
  if(task.role_type==='executive'){
    order.status=STATUS.APPROVED;order.current_step=STEP_MAP[STATUS.APPROVED];order.updated_at=now;
    let result=calculateScore(order.merchant_id);
    let snapshotId=db.nextSnapshotId++;
    db.snapshots.push({id:snapshotId,merchant_id:order.merchant_id,total_score:result.total_score,rating:result.rating,risk_coefficient:result.risk_coefficient,scenario:result.scenario,created_at:now});
    saveDB(db);
    return{success:true,order_id:order.id,snapshot_id:snapshotId,total_score:result.total_score,rating:result.rating,message:'终审通过，评分快照已写入'};
  }
  saveDB(db);
  return{success:true,order_id:order.id};
}

function rejectTask(taskId,assignee,comment){
  let db=getDB();
  let task=db.tasks.find(t=>t.id===taskId);
  if(!task)return{success:false,error:'任务不存在'};
  if(task.assignee!==assignee)return{success:false,error:'任务归属不匹配，无权处理'};
  if(task.task_status!=='pending')return{success:false,error:'任务当前状态为'+task.task_status+'，无法处理'};
  
  let order=db.orders.find(o=>o.id===task.order_id);
  if(!order)return{success:false,error:'审批单不存在'};
  let now=new Date().toLocaleString('zh-CN',{hour12:false});
  task.action='reject';task.comment=comment||'';task.task_status='done';task.handled_at=now;
  order.status=STATUS.REJECTED;order.current_step=STEP_MAP[STATUS.REJECTED];order.updated_at=now;
  
  if(PARALLEL_ROLES.includes(task.role_type)){
    let cancelled=0;
    db.tasks.filter(t=>t.order_id===order.id&&PARALLEL_ROLES.includes(t.role_type)&&t.task_status==='pending').forEach(t=>{
      t.task_status='cancelled';cancelled++;
    });
    saveDB(db);
    return{success:true,order_id:order.id,cancelled_count:cancelled,message:ROLE_LABELS[task.role_type]+'会签驳回，流程终止'};
  }
  saveDB(db);
  return{success:true,order_id:order.id,message:ROLE_LABELS[task.role_type]+'驳回，审批流程终止'};
}

let currentUser='业务员小王';

function toast(msg,type){
  let el=document.createElement('div');
  el.className='toast '+(type||'info');
  el.textContent=msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function fmtMoney(v){
  if(v===null||v===undefined)return '-';
  return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0});
}

function statusBadge(status){
  const map={pending_dept:['badge-blue','待复核'],parallel_signing:['badge-orange','会签中'],final_signing:['badge-blue','终审中'],approved:['badge-green','已通过'],rejected:['badge-red','已驳回']};
  let[cls,txt]=map[status]||['badge-gray',status];
  return`<span class="badge ${cls}">${txt}</span>`;
}

function scoreBadge(rating){
  return`<span class="score-badge score-${rating}">${rating}</span>`;
}

function renderDashboard(){
  let db=getDB();
  let totalM=db.merchants.length;

  let approved=db.orders.filter(o=>o.status===STATUS.APPROVED).length;

  let statusCounts={};
  db.orders.forEach(o=>{statusCounts[o.status]=(statusCounts[o.status]||0)+1;});
  
  let ratingCounts={};
  db.snapshots.forEach(s=>{ratingCounts[s.rating]=(ratingCounts[s.rating]||0)+1;});
  
  let html=`
  <div class="stat-grid">
    <div class="stat-card"><div class="label">客商总数</div><div class="value">${totalM}</div><div class="sub">已录入系统</div></div>

    <div class="card-header"><h3>审批状态分布</h3></div>
    <table><thead><tr><th>状态</th><th>数量</th></tr></thead><tbody>`;
  const statusNames={pending_dept:'待复核',parallel_signing:'会签中',final_signing:'终审中',approved:'已通过',rejected:'已驳回'};
  for(let s in statusNames){
    if(statusCounts[s]!==undefined){
      html+=`<tr><td>${statusBadge(s)}</td><td>${statusCounts[s]}</td></tr>`;

  html+=`<div class="card"><div class="card-header"><h3>数据管理</h3></div><button class="btn btn-outline" onclick="resetDB()">重置为初始数据</button></div>`;

    <tr><td style="color:var(--muted)">流水/授信</td><td>${fmtMoney(m.avg_bank_flow)} / ${fmtMoney(m.avg_approved_fund)}</td></tr>
  </tbody></table>`;
  
  if(contacts.length>0){
    html+=`<h3 style="margin-top:20px">对接人信息</h3><table><thead><tr><th>姓名</th><th>职务</th><th>电话</th><th>邮箱</th><th>角色</th></tr></thead><tbody>`;
    contacts.forEach(c=>{html+=`<tr><td>${c.name}${c.is_primary?' ⭐':''}</td><td>${c.position||'-'}</td><td>${c.phone||'-'}</td><td>${c.email||'-'}</td><td>${c.business_role||'-'}</td></tr>`;});
    html+=`</tbody></table>`;
  }
  
  if(fin.length>0){
    html+=`<h3 style="margin-top:20px">财务数据</h3><table><thead><tr><th>年度</th><th>季度</th><th>总资产</th><th>总负债</th><th>营收</th><th>净利润</th></tr></thead><tbody>`;
    fin.forEach(f=>{html+=`<tr><td>${f.period_year}</td><td>Q${f.period_quarter||'-'}</td><td>${fmtMoney(f.total_asset)}</td><td>${fmtMoney(f.total_liability)}</td><td>${fmtMoney(f.revenue)}</td><td>${fmtMoney(f.net_profit)}</td></tr>`;});
    html+=`</tbody></table>`;
  }
  
  html+=`<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

  <div class="form-row">
    <div class="form-group"><label>年度 *</label><input id="f_year" type="number" value="2024"></div>

function saveFinancial(id){
  let db=getDB();
  let year=+val('f_year');
  if(!year){toast('年度必填','error');return;}
  let q=val('f_quarter');
  let existing=db.financial.findIndex(f=>f.merchant_id===id&&f.period_year===year&&f.period_quarter==(q||null));
  let data={merchant_id:id,period_year:year,period_quarter:q?+q:null,total_asset:+val('f_ta')||0,total_liability:+val('f_tl')||0,current_asset:+val('f_ca')||0,current_liability:+val('f_cl')||0,revenue:+val('f_rev')||0,net_profit:+val('f_np')||0,inventory:+val('f_inv')||0,prepay:+val('f_pp')||0,operating_cash_flow:+val('f_ocf')||0,net_asset:+val('f_na')||0};
  if(existing>=0)db.financial[existing]=data;
  else db.financial.push(data);
  saveDB(db);
  closeModal();toast('财务数据保存成功','success');renderMerchants();
}

function showSubmitApproval(id){
  let db=getDB();
  let m=db.merchants.find(x=>x.merchant_id===id);
  let result=calculateScore(id);
  let html=`<h3>提交审批 - ${m.merchant_name}</h3>`;
  
  if(!result.qualified){
    html+=`<div style="background:#fee2e2;padding:12px;border-radius:8px;margin-bottom:16px;color:#991b1b">
      <strong>评分不合格</strong><br>总分: ${result.total_score} | 评级: ${result.rating}<br>不允许提交审批
    </div>`;
  }else{
    html+=`<div style="background:#dcfce7;padding:12px;border-radius:8px;margin-bottom:16px;color:#166534">
      <strong>评分合格</strong><br>总分: ${result.total_score} | 评级: ${result.rating} | 风控系数: ${result.risk_coefficient}
    </div>`;
    const dimNames={subject_quality:'主体资质',financial:'财务',project_quality:'项目质量',performance_quality:'履约质量'};
    for(let dim of ALL_DIMENSIONS){
      let score=result.dimension_scores[dim]||0;
      html+=`<div class="dimension-score"><span class="name">${dimNames[dim]}</span><div class="bar"><div style="width:${Math.min(score,100)}%"></div></div><span class="val">${score}</span></div>`;
    }
    html+=`<div class="form-group" style="margin-top:16px"><label>申请备注</label><textarea id="a_remark" rows="3" placeholder="申请说明（可选）"></textarea></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doSubmitApproval(${id})">提交审批</button></div>`;
  }
  html+=`<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function doSubmitApproval(id){
  let result=submitApproval(id,currentUser,val('a_remark'));
  if(result.success){closeModal();toast(result.message,'success');navigateTo('approval');}
  else toast(result.error||result.message,'error');
}

// --- 审批工作流 ---
function renderApproval(){
  let db=getDB();
  let role=ROLE_MAP[currentUser];
  let html='<div class="card"><div class="card-header"><h3>';
  
  if(currentUser==='业务员小王'){
    html+='我提交的审批';
    let myOrders=db.orders.filter(o=>o.applicant===currentUser);
    html+='</h3></div><table><thead><tr><th>客商</th><th>状态</th><th>评分</th><th>评级</th><th>申请时间</th><th>操作</th></tr></thead><tbody>';
    myOrders.forEach(o=>{
      let m=db.merchants.find(x=>x.merchant_id===o.merchant_id);
      html+=`<tr><td>${m?m.merchant_name:'-'}</td><td>${statusBadge(o.status)}</td><td>${o.total_score||'-'}</td><td>${o.rating?scoreBadge(o.rating):'-'}</td><td>${o.apply_time}</td><td><button class="btn btn-outline btn-sm" onclick="showApprovalDetail(${o.id})">详情</button></td></tr>`;
    });
    if(myOrders.length===0)html+='<tr><td colspan="6" class="empty">暂无审批记录，请到客商管理中提交</td></tr>';
  }else{
    html+='我的待办任务';
    let myTasks=db.tasks.filter(t=>t.assignee===currentUser&&t.task_status==='pending');
    html+='</h3></div><table><thead><tr><th>客商</th><th>步骤</th><th>评分</th><th>评级</th><th>申请人</th><th>操作</th></tr></thead><tbody>';
    myTasks.forEach(t=>{
      let order=db.orders.find(o=>o.id===t.order_id);
      if(!order)return;
      let m=db.merchants.find(x=>x.merchant_id===order.merchant_id);
      html+=`<tr><td>${m?m.merchant_name:'-'}</td><td>${order.current_step}</td><td>${order.total_score||'-'}</td><td>${order.rating?scoreBadge(order.rating):'-'}</td><td>${order.applicant}</td><td>
        <button class="btn btn-success btn-sm" onclick="doApprove(${t.id})">通过</button>
        <button class="btn btn-danger btn-sm" onclick="doReject(${t.id})">驳回</button>
      </td></tr>`;
    });
    if(myTasks.length===0)html+='<tr><td colspan="6" class="empty">暂无待办任务</td></tr>';
  }
  html+='</tbody></table></div>';
  document.getElementById('view-approval').innerHTML=html;
}

function doApprove(taskId){
  let html=`<h3>审批通过</h3>
  <div class="form-group"><label>审批意见</label><textarea id="t_comment" rows="3" placeholder="请输入审批意见"></textarea></div>
  <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="confirmApprove(${taskId})">确认通过</button></div>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function confirmApprove(taskId){
  let result=approveTask(taskId,currentUser,val('t_comment'));
  if(result.success){closeModal();toast(result.message,'success');renderApproval();}
  else toast(result.error,'error');
}

function doReject(taskId){
  let html=`<h3>审批驳回</h3>
  <div class="form-group"><label>驳回原因</label><textarea id="t_comment" rows="3" placeholder="请输入驳回原因"></textarea></div>
  <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmReject(${taskId})">确认驳回</button></div>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function confirmReject(taskId){
  let result=rejectTask(taskId,currentUser,val('t_comment'));
  if(result.success){closeModal();toast(result.message,'success');renderApproval();}
  else toast(result.error,'error');
}

function showApprovalDetail(orderId){
  let db=getDB();
  let order=db.orders.find(o=>o.id===orderId);
  if(!order)return;
  let m=db.merchants.find(x=>x.merchant_id===order.merchant_id);
  let tasks=db.tasks.filter(t=>t.order_id===orderId).sort((a,b)=>(a.id-b.id));
  let dimScores={};
  try{dimScores=JSON.parse(order.dimension_scores||'{}');}catch(e){}
  
  let html=`<h3>审批详情 - ${m?m.merchant_name:''}</h3>
  <table><tbody>
    <tr><td style="width:100px;color:var(--muted)">审批单号</td><td>#${order.id}</td></tr>
    <tr><td style="color:var(--muted)">申请人</td><td>${order.applicant}</td></tr>
    <tr><td style="color:var(--muted)">申请时间</td><td>${order.apply_time}</td></tr>
    <tr><td style="color:var(--muted)">当前状态</td><td>${statusBadge(order.status)}</td></tr>
    <tr><td style="color:var(--muted)">当前步骤</td><td>${order.current_step}</td></tr>
    <tr><td style="color:var(--muted)">评分</td><td>${order.total_score||'-'} ${order.rating?scoreBadge(order.rating):''}</td></tr>
    ${order.remark?`<tr><td style="color:var(--muted)">备注</td><td>${order.remark}</td></tr>`:''}
  </tbody></table>`;
  
  const dimNames={subject_quality:'主体资质',financial:'财务',project_quality:'项目质量',performance_quality:'履约质量'};
  if(Object.keys(dimScores).length>0){
    html+='<h3 style="margin-top:16px">维度得分</h3>';
    for(let dim of ALL_DIMENSIONS){
      let score=dimScores[dim]||0;
      html+=`<div class="dimension-score"><span class="name">${dimNames[dim]}</span><div class="bar"><div style="width:${Math.min(score,100)}%"></div></div><span class="val">${score}</span></div>`;
    }
  }
  
  html+='<h3 style="margin-top:16px">审批流程</h3><ul class="timeline">';
  const roleNames={dept_head:'部门负责人',market:'市场部',compliance:'法务部',finance:'财务部',executive:'公司领导'};
  tasks.forEach(t=>{
    let dotClass=t.task_status==='done'?'done':t.task_status==='cancelled'?'cancelled':'pending';
    let actionText=t.action==='approve'?'通过':t.action==='reject'?'驳回':'待处理';
    html+=`<li class="timeline-item"><div class="timeline-dot ${dotClass}"></div><div class="timeline-content">
      <div class="role">${roleNames[t.role_type]||t.role_type} - ${t.assignee} <span class="badge ${t.action==='approve'?'badge-green':t.action==='reject'?'badge-red':'badge-gray'} btn-sm">${actionText}</span></div>
      ${t.comment?`<div class="comment">${t.comment}</div>`:''}
      <div class="time">${t.handled_at||t.created_at}</div>
    </div></li>`;
  });
  html+='</ul>';
  
  html+=`<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

// --- 审批历史 ---
function renderHistory(){
  let db=getDB();
  let orders=db.orders.sort((a,b)=>b.id-a.id);
  let html='<div class="card"><div class="card-header"><h3>审批历史</h3></div><table><thead><tr><th>单号</th><th>客商</th><th>申请人</th><th>状态</th><th>评分</th><th>评级</th><th>申请时间</th><th>操作</th></tr></thead><tbody>';
  orders.forEach(o=>{
    let m=db.merchants.find(x=>x.merchant_id===o.merchant_id);
    html+=`<tr><td>#${o.id}</td><td>${m?m.merchant_name:'-'}</td><td>${o.applicant}</td><td>${statusBadge(o.status)}</td><td>${o.total_score||'-'}</td><td>${o.rating?scoreBadge(o.rating):'-'}</td><td>${o.apply_time}</td><td><button class="btn btn-outline btn-sm" onclick="showApprovalDetail(${o.id})">详情</button></td></tr>`;
  });
  if(orders.length===0)html+='<tr><td colspan="8" class="empty">暂无审批记录</td></tr>';
  html+='</tbody></table></div>';
  document.getElementById('view-history').innerHTML=html;
}

// --- 工具函数 ---
function val(id){let el=document.getElementById(id);return el?el.value:'';}

function closeModal(){document.getElementById('modal').classList.remove('show');}

function navigateTo(view){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`).classList.add('active');
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  const titles={dashboard:'系统看板',merchants:'客商管理',approval:'审批工作流',history:'审批历史'};
  document.getElementById('pageTitle').textContent=titles[view];
  let badge=document.getElementById('topBadge');
  if(view==='approval'&&currentUser!=='业务员小王'){
    let db=getDB();
    let count=db.tasks.filter(t=>t.assignee===currentUser&&t.task_status==='pending').length;
    badge.textContent=count+' 个待办';
    badge.className='badge '+(count>0?'badge-orange':'badge-gray');
  }else{
    badge.textContent=currentUser;
    badge.className='badge badge-blue';
  }
  ({dashboard:renderDashboard,merchants:renderMerchants,approval:renderApproval,history:renderHistory})[view]();
}

// --- 初始化 ---
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click',()=>navigateTo(n.dataset.view));
});
document.getElementById('roleSelect').addEventListener('change',e=>{
  currentUser=e.target.value;
  navigateTo('dashboard');
});
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal')closeModal();
});
navigateTo('dashboard');
</script>
