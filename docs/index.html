<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客商准入评级系统 - 运营中台</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1e40af;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f172a;color:#fff;display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header h1{font-size:18px;font-weight:700}
.sidebar-header p{font-size:12px;color:#94a3b8;margin-top:4px}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:#94a3b8;transition:all .2s;font-size:14px}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#94a3b8}
.main{flex:1;margin-left:240px;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h2{font-size:20px;font-weight:700}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-orange{background:#fed7aa;color:#9a3412}
.badge-gray{background:#e2e8f0;color:#475569}
.badge-purple{background:#ede9fe;color:#5b21b6}
.content{display:none}
.content.active{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-header h3{font-size:15px;font-weight:600}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-warning{background:var(--orange);color:#fff}
.btn-warning:hover{background:#c2410c}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#f8fafc}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:680px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:40px;color:var(--muted)}
.score-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-weight:700;font-size:13px}
.score-AAA{background:#dcfce7;color:#166534}
.score-AA{background:#d1fae5;color:#065f46}
.score-A{background:#dbeafe;color:#1e40af}
.score-BBB{background:#e0e7ff;color:#3730a3}
.score-BB{background:#fef3c7;color:#92400e}
.score-B{background:#fed7aa;color:#9a3412}
.score-UNQUALIFIED{background:#fee2e2;color:#991b1b}
.dimension-score{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dimension-score .name{width:100px;font-size:12px;color:var(--muted)}
.dimension-score .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.dimension-score .bar div{height:100%;border-radius:4px}
.dimension-score .val{width:50px;text-align:right;font-size:13px;font-weight:600}
/* Toggle switch */
.toggle{position:relative;display:inline-block;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.3s;border-radius:24px}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
.toggle input:checked+.toggle-slider{background:var(--primary)}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px)}
.toggle-label{display:flex;align-items:center;gap:8px;font-size:13px}
/* Import area */
.import-area{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;margin-bottom:12px;transition:all .2s}
.import-area:hover{border-color:var(--primary);background:#eff6ff}
.import-area.dragover{border-color:var(--primary);background:#dbeafe}
.import-area p{color:var(--muted);margin:8px 0}
.import-textarea{width:100%;height:120px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:6px;resize:vertical}
/* Level badge */
.level-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.level-strategic{background:#ede9fe;color:#5b21b6}
.level-core{background:#dbeafe;color:#1e40af}
.level-standard{background:#dcfce7;color:#166534}
.level-other{background:#e2e8f0;color:#475569}
/* Filter bar */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
/* Info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.info-item{display:flex;flex-direction:column}
.info-item .lbl{font-size:11px;color:var(--muted);margin-bottom:2px}
.info-item .val{font-size:14px;font-weight:500}
/* Progress bar for scoring */
.score-progress{margin:8px 0}
.score-progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.score-progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-progress-bar div{height:100%;border-radius:3px;transition:width .3s}
/* Tab styles */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab:hover{color:var(--primary)}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<div class="sidebar-header"><h1>客商准入评级系统</h1><p>运营中台 · 风控评分</p></div>
<div class="nav" id="nav">
<div class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>系统看板</div>
<div class="nav-item" data-view="merchants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>客商管理</div>
<div class="nav-item" data-view="financial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>财务数据</div>
<div class="nav-item" data-view="project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>立项质量</div>
<div class="nav-item" data-view="performance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>履约质量</div>

</div>
<div class="sidebar-footer">运营中台用户 · 单角色模式<br>数据按附件规则自动评级</div>
</div>
<div class="main">
<div class="topbar"><h2 id="pageTitle">系统看板</h2><span id="topBadge" class="badge badge-blue">运营中台</span></div>
<div class="content active" id="view-dashboard"></div>
<div class="content" id="view-merchants"></div>
<div class="content" id="view-financial"></div>
<div class="content" id="view-project"></div>

<script>
// ======================================================================
// 评分引擎 — 按附件2《客商综合评估标准》实现
// 支持阶梯计分(accumulate)、阶梯扣分(deduct)、固定得分(fixed)
// ======================================================================

// --- 阶梯评分核心函数 ---
function scoreTiered(value, segments) {
  if (value === null || value === undefined || isNaN(value)) return 0;
  for (let seg of segments) {
    let upper = seg.upper === null ? Infinity : seg.upper;
    if (seg.lower <= value && value < upper) {
      if (seg.type === 'fixed') return seg.base_score;
      let units = (value - seg.lower) / seg.unit_value;
      if (seg.type === 'deduct') {
        return Math.max(0, Math.round((seg.base_score - units * seg.unit_score) * 100) / 100);
      }
      return Math.min(seg.max_score, Math.round((seg.base_score + units * seg.unit_score) * 100) / 100);
    }
  }
  return 0;
}

// --- 安全除法 ---
function safeDiv(a, b) { return (!b || b === 0) ? 0 : a / b; }

// --- 主体资质指标评分规则 (25%) ---
const RULES_SUBJECT = {
  registered_capital: {
    weight: 0.50 * 0.60, // 资本金50% × 注册资本60% = 30%
    segments: [
      {lower:0, upper:10000000, unit_value:1000000, unit_score:2, base_score:0, max_score:20, type:'accumulate'},
      {lower:10000000, upper:30000000, unit_value:1000000, unit_score:1.5, base_score:20, max_score:50, type:'accumulate'},
      {lower:30000000, upper:50000000, unit_value:1000000, unit_score:1, base_score:50, max_score:70, type:'accumulate'},
      {lower:50000000, upper:null, unit_value:1000000, unit_score:0.5, base_score:70, max_score:100, type:'accumulate'}
    ]
  },
  paid_in_ratio: {
    weight: 0.50 * 0.40, // 资本金50% × 实缴比例40% = 20%
    segments: [
      {lower:0, upper:0.50, unit_value:0.01, unit_score:0.4, base_score:0, max_score:20, type:'accumulate'},
      {lower:0.50, upper:0.75, unit_value:0.01, unit_score:1.6, base_score:20, max_score:60, type:'accumulate'},
      {lower:0.75, upper:0.90, unit_value:0.01, unit_score:2, base_score:60, max_score:90, type:'accumulate'},
      {lower:0.90, upper:1.01, unit_value:0.01, unit_score:1, base_score:90, max_score:100, type:'accumulate'}
    ]
  },
  establish_years: {
    weight: 0.10,
    segments: [
      {lower:0, upper:2, unit_value:1, unit_score:5, base_score:0, max_score:10, type:'accumulate'},
      {lower:2, upper:5, unit_value:1, unit_score:8, base_score:10, max_score:34, type:'accumulate'},
      {lower:5, upper:10, unit_value:1, unit_score:10, base_score:34, max_score:84, type:'accumulate'},
      {lower:10, upper:null, unit_value:1, unit_score:3, base_score:84, max_score:100, type:'accumulate'}
    ]
  },
  tax_completion: {
    weight: 0.40 * 0.40, // 资信情况40% × 不欠税证明40% = 16%
    segments: [
      {lower:0, upper:101, unit_value:1, unit_score:1, base_score:0, max_score:100, type:'accumulate'}
    ]
  },
  lawsuit_score: {
    weight: 0.40 * 0.60, // 资信情况40% × 涉诉60% = 24%
    custom: true
  }
};

// --- 财务情况指标评分规则 (30%) ---
const RULES_FINANCIAL = {
  asset_liability_ratio: {
    weight: 0.30 * 0.40, // 偿债能力30% × 资产负债率40% = 12%
    segments: [
      {lower:0, upper:0.40, unit_value:0.01, unit_score:0.5, base_score:100, type:'deduct'},
      {lower:0.40, upper:0.60, unit_value:0.01, unit_score:2, base_score:80, type:'deduct'},
      {lower:0.60, upper:0.80, unit_value:0.01, unit_score:1, base_score:40, type:'deduct'},
      {lower:0.80, upper:null, unit_value:0.01, unit_score:0.5, base_score:20, type:'deduct'}
    ]
  },
  quick_ratio: {
    weight: 0.30 * 0.30, // 偿债能力30% × 速动比率30% = 9%
    deviation: true, // 基于|速动比率-90%|计分
    segments: [
      {lower:0, upper:0.10, unit_value:0.01, unit_score:1, base_score:100, type:'deduct'},
      {lower:0.10, upper:0.30, unit_value:0.01, unit_score:1.5, base_score:90, type:'deduct'},
      {lower:0.30, upper:0.60, unit_value:0.01, unit_score:1, base_score:60, type:'deduct'},
      {lower:0.60, upper:null, unit_value:0.01, unit_score:1.5, base_score:45, type:'deduct'}
    ]
  },
  cash_flow_ratio: {
    weight: 0.30 * 0.30, // 偿债能力30% × 现金流量比率30% = 9%
    segments: [
      {lower:0, upper:0.30, unit_value:0.01, unit_score:0.5, base_score:0, max_score:15, type:'accumulate'},
      {lower:0.30, upper:0.50, unit_value:0.01, unit_score:2, base_score:15, max_score:55, type:'accumulate'},
      {lower:0.50, upper:1.00, unit_value:0.01, unit_score:0.8, base_score:55, max_score:95, type:'accumulate'},
      {lower:1.00, upper:null, unit_value:0.01, unit_score:1, base_score:95, max_score:100, type:'accumulate'}
    ]
  },
  net_profit_margin: {
    weight: 0.30 * 0.35, // 盈利能力30% × 销售净利率35% = 10.5%
    segments: [
      {lower:0, upper:0.03, unit_value:0.01, unit_score:5, base_score:0, max_score:15, type:'accumulate'},
      {lower:0.03, upper:0.09, unit_value:0.01, unit_score:10, base_score:15, max_score:75, type:'accumulate'},
      {lower:0.09, upper:0.14, unit_value:0.01, unit_score:3, base_score:75, max_score:90, type:'accumulate'},
      {lower:0.14, upper:null, unit_value:0.01, unit_score:1, base_score:90, max_score:100, type:'accumulate'}
    ]
  },
  roe: {
    weight: 0.30 * 0.35, // 盈利能力30% × 净资产收益率35% = 10.5%
    segments: [
      {lower:0, upper:0.03, unit_value:0.01, unit_score:5, base_score:0, max_score:15, type:'accumulate'},
      {lower:0.03, upper:0.13, unit_value:0.01, unit_score:4.5, base_score:15, max_score:60, type:'accumulate'},
      {lower:0.13, upper:0.18, unit_value:0.01, unit_score:6, base_score:60, max_score:90, type:'accumulate'},
      {lower:0.18, upper:null, unit_value:0.01, unit_score:2, base_score:90, max_score:100, type:'accumulate'}
    ]
  },
  cash_flow_net_margin: {
    weight: 0.30 * 0.30, // 盈利能力30% × 现金流净利率30% = 9%
    segments: [
      {lower:0, upper:0.40, unit_value:0.01, unit_score:0.5, base_score:0, max_score:20, type:'accumulate'},
      {lower:0.40, upper:0.80, unit_value:0.01, unit_score:1, base_score:20, max_score:60, type:'accumulate'},
      {lower:0.80, upper:1.00, unit_value:0.01, unit_score:1.5, base_score:60, max_score:90, type:'accumulate'},
      {lower:1.00, upper:null, unit_value:0.01, unit_score:0.5, base_score:90, max_score:100, type:'accumulate'}
    ]
  },
  asset_turnover: {
    weight: 0.40 * 0.50, // 经营能力40% × 资产周转率50% = 20%
    segments: [
      {lower:0, upper:0.4, unit_value:0.1, unit_score:5, base_score:0, max_score:20, type:'accumulate'},
      {lower:0.4, upper:0.9, unit_value:0.1, unit_score:8, base_score:20, max_score:60, type:'accumulate'},
      {lower:0.9, upper:1.5, unit_value:0.1, unit_score:5, base_score:60, max_score:90, type:'accumulate'},
      {lower:1.5, upper:null, unit_value:0.1, unit_score:2.5, base_score:90, max_score:100, type:'accumulate'}
    ]
  },
  capital_operation: {
    weight: 0.40 * 0.50, // 经营能力40% × 资本运作能力50% = 20%
    segments: [
      {lower:0, upper:0.10, unit_value:0.01, unit_score:2, base_score:0, max_score:20, type:'accumulate'},
      {lower:0.10, upper:0.25, unit_value:0.01, unit_score:3, base_score:20, max_score:65, type:'accumulate'},
      {lower:0.25, upper:0.30, unit_value:0.01, unit_score:5, base_score:65, max_score:90, type:'accumulate'},
      {lower:0.30, upper:null, unit_value:0.01, unit_score:1, base_score:90, max_score:100, type:'accumulate'}
    ]
  }
};

// --- 立项质量指标评分规则 (45%) ---
const RULES_PROJECT = {
  estimated_revenue: {
    weight: 0.60 * 0.45, // 项目收益60% × 预计营收45% = 27%
    segments: [
      {lower:0, upper:5000000, unit_value:1000000, unit_score:2, base_score:0, max_score:10, type:'accumulate'},
      {lower:5000000, upper:10000000, unit_value:1000000, unit_score:3, base_score:10, max_score:25, type:'accumulate'},
      {lower:10000000, upper:30000000, unit_value:1000000, unit_score:2.5, base_score:25, max_score:75, type:'accumulate'},
      {lower:30000000, upper:null, unit_value:10000000, unit_score:10, base_score:75, max_score:100, type:'accumulate'}
    ]
  },
  project_profit_rate: {
    weight: 0.60 * 0.30, // 项目收益60% × 项目利润30% = 18%
    segments: [
      {lower:-1, upper:0.03, unit_value:0.001, unit_score:0, base_score:0, max_score:0, type:'accumulate'},
      {lower:0.03, upper:0.045, unit_value:0.001, unit_score:2, base_score:0, max_score:30, type:'accumulate'},

// --- 履约质量指标评分规则 (45%) ---
const RULES_PERFORMANCE = {

    segments: [

    ]
  },

    segments: [

    ]
  },
  overdue_warning_rate: {

    segments: [
      {lower:0, upper:null, unit_value:0.01, unit_score:1, base_score:100, type:'deduct'}
    ]
  }
};

// --- 客商层级系数 ---
const LEVEL_COEFFICIENTS = {
  strategic: {name: '战略层', coefficient: 1.5, desc: '央企全资（二级公司及以上）/ 战略合作伙伴'},
  core: {name: '核心层', coefficient: 1.3, desc: '央企控股、省属国企全资或绝对控股 / 中国500强 / 国有控股上市公司'},
  standard: {name: '标准层', coefficient: 1.1, desc: '地方国企、上市公司三级及以上'},
  other: {name: '其他', coefficient: 1.0, desc: '符合风控指引要求但非上述性质的企业类型'}
};

// --- 评级映射 ---
const RATING_THRESHOLDS = [
  [90, null, 'AAA', 0.50], [80, 90, 'AA', 0.70], [70, 80, 'A', 0.85],
  [60, 70, 'BBB', 1.00], [50, 60, 'BB', 1.20], [40, 50, 'B', 1.50], [0, 40, 'UNQUALIFIED', 2.00]
];

function mapRating(totalScore) {
  let s = Number(totalScore) || 0;
  for (let [lo, hi, r, co] of RATING_THRESHOLDS) {
    if (hi === null && s >= lo) return [r, co];
    if (lo <= s && s < hi) return [r, co];
  }
  return ['UNQUALIFIED', 2.00];
}

// --- 涉诉评分（特殊计算） ---
function scoreLawsuit(profile) {
  let total = profile.lawsuit_total || 0;
  if (total === 0) return 100;
  let defendantRatio = (profile.defendant_count || 0) / total;
  let executedRatio = (profile.executed_count || 0) / total;
  let executedAmountRatio = (profile.executed_amount || 0) / Math.max(profile.paid_in_capital || 1, 1);
  // 各子项从100分起扣，-1分/1%
  let defendantScore = Math.max(0, 100 - defendantRatio * 100);
  let executedCountScore = Math.max(0, 100 - executedRatio * 100);
  let executedAmountScore = Math.max(0, 100 - executedAmountRatio * 100);
  // 加权: 被告20% + 被执行数35% + 被执行金额45%
  let score = defendantScore * 0.20 + executedCountScore * 0.35 + executedAmountScore * 0.45;
  // 被告占比超60%额外扣10分
  if (defendantRatio > 0.60) score -= 10;
  return Math.max(0, Math.round(score * 100) / 100);
}

// --- 计算财务比率 ---
function computeRatios(d) {
  let ta = +(d.total_asset||0), tl = +(d.total_liability||0), ca = +(d.current_asset||0);
  let cl = +(d.current_liability||0), rev = +(d.revenue||0), np = +(d.net_profit||0);
  let inv = +(d.inventory||0), pp = +(d.prepay||0), ocf = +(d.operating_cash_flow||0), na = +(d.net_asset||0);
  return {
    asset_liability_ratio: safeDiv(tl, ta),
    quick_ratio: safeDiv(ca - inv - pp, cl),
    cash_flow_ratio: safeDiv(ocf, cl),
    net_profit_margin: safeDiv(np, rev),
    roe: safeDiv(np, na),
    cash_flow_net_margin: safeDiv(ocf, np),
    asset_turnover: safeDiv(rev, ta),
    capital_operation: safeDiv(na, ta)
  };
}

// --- 维度评分 ---
function scoreDimension(rules, values) {
  let total = 0;
  for (let code in rules) {
    let rule = rules[code];
    let val = values[code];
    let score = 0;
    if (rule.custom) {
      score = rule === RULES_SUBJECT.lawsuit_score ? scoreLawsuit(values._profile || {}) : 0;
    } else if (rule.deviation) {
      // 速动比率: 基于|value - 90%|计分
      let dev = Math.abs((val || 0) - 0.90);
      score = scoreTiered(dev, rule.segments);
    } else {
      score = scoreTiered(val, rule.segments);
    }
    total += score * rule.weight;
  }
  return Math.round(total * 100) / 100;
}

// --- 维度权重配置（按场景）---
const DIMENSION_WEIGHTS = {
  'FIRST|true': {subject_quality: 0.25, financial: 0.30, project_quality: 0.45},
  'FIRST|false': {subject_quality: 1.0},
  'DYNAMIC|true': {subject_quality: 0.25, financial: 0.30, performance_quality: 0.45},
  'DYNAMIC|false': {subject_quality: 0.35, performance_quality: 0.65}
};

function getDimensionWeights(scenario, isCredit) {
  return DIMENSION_WEIGHTS[scenario + '|' + isCredit] || {subject_quality: 1.0};
}

// --- 评分引擎核心 ---
function calculateScore(merchantId) {
  let db = getDB();
  let m = db.merchants.find(x => x.merchant_id === merchantId);
  if (!m) throw new Error('客商不存在');

  let isCredit = m.is_credit_applied === true || m.is_credit_applied === 'true';
  let scenario = db.snapshots.some(s => s.merchant_id === merchantId) ? 'DYNAMIC' : 'FIRST';
  let weights = getDimensionWeights(scenario, isCredit);

  // 主体资质
  let profile = {
    registered_capital: m.registered_capital,
    paid_in_capital: m.paid_in_capital,
    establish_date: m.establish_date,
    tax_completion_status: m.tax_completion_status,
    lawsuit_total: m.lawsuit_total,
    defendant_count: m.defendant_count,
    executed_count: m.executed_count,
    executed_amount: m.executed_amount,
    paid_in_capital: m.paid_in_capital
  };
  let establishYears = 0;
  if (m.establish_date) {
    let y = parseInt(m.establish_date.substring(0, 4));
    if (!isNaN(y)) establishYears = new Date().getFullYear() - y;
  }
  let paidInRatio = m.registered_capital > 0 ? m.paid_in_capital / m.registered_capital : 0;
  let subjectValues = {
    registered_capital: m.registered_capital,
    paid_in_ratio: paidInRatio,
    establish_years: establishYears,
    tax_completion: m.tax_completion_status,
    lawsuit_score: 0,
    _profile: profile
  };
  let subjectScore = scoreDimension(RULES_SUBJECT, subjectValues);

  // 财务情况
  let finScore = 0;
  let ratios = null;
  if (isCredit) {
    let finData = db.financial.filter(f => f.merchant_id === merchantId)
      .sort((a, b) => b.period_year - a.period_year || (b.period_quarter || 0) - (a.period_quarter || 0));
    if (finData.length > 0) {
      ratios = computeRatios(finData[0]);
      let finValues = {
        asset_liability_ratio: ratios.asset_liability_ratio,
        quick_ratio: ratios.quick_ratio,
        cash_flow_ratio: ratios.cash_flow_ratio,
        net_profit_margin: ratios.net_profit_margin,
        roe: ratios.roe,
        cash_flow_net_margin: ratios.cash_flow_net_margin,
        asset_turnover: ratios.asset_turnover,
        capital_operation: ratios.capital_operation
      };
      finScore = scoreDimension(RULES_FINANCIAL, finValues);
    }
  }

  // 立项质量
  let projectScore = 0;
  if (isCredit && scenario === 'FIRST') {
    let pq = db.project_quality.find(p => p.merchant_id === merchantId);
    if (pq) {
      let projValues = {
        estimated_revenue: pq.estimated_revenue,
        project_profit_rate: pq.project_profit_rate,
        project_turnover: pq.project_turnover,
        market_condition: pq.market_condition,
        product_category: pq.product_category,
        sales_cycle: pq.sales_cycle,
        contract_terms: pq.contract_terms,
        warehouse_control: pq.warehouse_control
      };
      projectScore = scoreDimension(RULES_PROJECT, projValues);
    }
  }

  // 履约质量
  let perfScore = 0;
  if (scenario === 'DYNAMIC') {
    let perf = db.performance_quality.find(p => p.merchant_id === merchantId);
    if (perf) {
      let overdueRatio = perf.annual_revenue > 0 ? perf.historical_overdue_amount / perf.annual_revenue : 0;
      let firstOverdueRate = perf.total_project_count > 0 ? perf.overdue_project_count / perf.total_project_count : 0;
      let overdueWarningRate = perf.total_batch_count > 0 ? perf.overdue_60days_batch_count / perf.total_batch_count : 0;
      let perfValues = {
        annual_revenue: perf.annual_revenue,
        overdue_scale: overdueRatio,
        first_overdue_rate: firstOverdueRate,
        overdue_warning_rate: overdueWarningRate
      };
      perfScore = scoreDimension(RULES_PERFORMANCE, perfValues);
    }
  }

  let dimScores = {
    subject_quality: subjectScore,
    financial: finScore,
    project_quality: projectScore,
    performance_quality: perfScore
  };

  // 基础准入分 = 各维度加权求和
  let baseScore = 0;
  for (let dim in weights) {
    baseScore += dimScores[dim] * weights[dim];
  }
  baseScore = Math.round(baseScore * 100) / 100;

  // 客商层级系数
  let levelKey = m.merchant_level || 'other';
  let levelInfo = LEVEL_COEFFICIENTS[levelKey] || LEVEL_COEFFICIENTS.other;
  let coefficient = levelInfo.coefficient;
  // 贸易商/平台公司系数下浮0.2
  if (m.merchant_type === 'trade' || m.merchant_type === 'platform') {
    coefficient = Math.max(0.1, coefficient - 0.2);
  }

  // 准入静态分 = 基础准入分 × 客商层级系数
  let totalScore = Math.round(baseScore * coefficient * 100) / 100;
  let [rating, riskCo] = mapRating(totalScore);
  let qualified = rating !== 'UNQUALIFIED' && totalScore >= 60;

  return {
    merchant_id: merchantId,
    scenario, is_credit_applied: isCredit,
    dimension_scores: dimScores,
    base_score: baseScore,
    level_coefficient: coefficient,
    total_score: totalScore,
    rating, risk_coefficient: riskCo, qualified,
    weights
  };
}

// ======================================================================
// CSV 解析（支持逗号和制表符分隔）
// ======================================================================
function parseDelimited(text) {
  let lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  let delimiter = lines[0].includes('\t') ? '\t' : ',';
  let headers = lines[0].split(delimiter).map(h => h.trim().replace(/^"|"$/g, ''));
  let rows = [];
  for (let i = 1; i < lines.length; i++) {
    let values = lines[i].split(delimiter).map(v => v.trim().replace(/^"|"$/g, ''));
    let row = {};
    headers.forEach((h, j) => row[h] = values[j]);
    rows.push(row);
  }
  return rows;
}

function downloadCSV(filename, headers, sampleRow) {
  let csv = headers.join(',') + '\n';
  if (sampleRow) csv += sampleRow.join(',') + '\n';
  let blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
  let link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

    <div class="card-header"><h3>授信类型分布</h3></div>
    <table><thead><tr><th>类型</th><th>数量</th><th>占比</th></tr></thead><tbody>
      <tr><td>需申报风险敞口</td><td>${creditCount}</td><td>${total ? Math.round(creditCount/total*100) : 0}%</td></tr>
      <tr><td>无需申报风险敞口</td><td>${noCreditCount}</td><td>${total ? Math.round(noCreditCount/total*100) : 0}%</td></tr>
    </tbody></table>
  </div>`;

  if (Object.keys(ratingCounts).length > 0) {
    html += `<div class="card"><div class="card-header"><h3>评级分布</h3></div><table><thead><tr><th>评级</th><th>数量</th><th>占比</th><th>分布</th></tr></thead><tbody>`;
    const order = ['AAA','AA','A','BBB','BB','B','UNQUALIFIED'];
    let maxCount = Math.max(...Object.values(ratingCounts));
    order.forEach(r => {
      if (ratingCounts[r] !== undefined) {
        let pct = rated ? Math.round(ratingCounts[r]/rated*100) : 0;
        let barWidth = maxCount ? Math.round(ratingCounts[r]/maxCount*100) : 0;
        html += `<tr><td>${scoreBadge(r)}</td><td>${ratingCounts[r]}</td><td>${pct}%</td><td><div style="width:200px;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:${barWidth}%;height:100%;background:var(--primary);border-radius:4px"></div></div></td></tr>`;
      }
    });
    html += `</tbody></table></div>`;
  }

  html += `<div class="card"><div class="card-header"><h3>快捷操作</h3></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="navigateTo('merchants')">新增客商</button>
      <button class="btn btn-outline" onclick="navigateTo('financial')">财务数据导入</button>
      <button class="btn btn-outline" onclick="navigateTo('project')">立项质量录入</button>
      <button class="btn btn-outline" onclick="navigateTo('performance')">履约质量录入</button>
      <button class="btn btn-outline" onclick="navigateTo('pool')">查看客商池</button>
    </div>
  </div>
  <div class="card"><div class="card-header"><h3>数据管理</h3></div><button class="btn btn-outline" onclick="resetDB()">重置为初始数据</button></div>`;

  document.getElementById('view-dashboard').innerHTML = html;
}

  db.merchants.forEach(m => {
    let snap = db.snapshots.filter(s => s.merchant_id === m.merchant_id).sort((a,b) => b.id - a.id)[0];
    html += `<tr>
      <td>${m.merchant_name}</td>
      <td>${m.legal_person||'-'}</td>

      <td>${creditBadge(m.is_credit_applied)}</td>

      <td>
        <button class="btn btn-outline btn-sm" onclick="showMerchantDetail(${m.merchant_id})">详情</button>
        <button class="btn btn-outline btn-sm" onclick="showMerchantForm(${m.merchant_id})">编辑</button>
        <button class="btn btn-success btn-sm" onclick="showRatingModal(${m.merchant_id})">评级</button>
      </td>

  html += `</tbody></table></div>`;
  document.getElementById('view-merchants').innerHTML = html;
}

function saveMerchant(editId) {
  let db = getDB();
  let name = val('m_name').trim();
  let tax = val('m_tax').trim();
  if (!name || !tax) { toast('名称和信用代码必填', 'error'); return; }
  let data = {
    merchant_name: name, tax_number: tax, legal_person: val('m_legal'),
    actual_controller: val('m_controller'),
    registered_capital: +val('m_capital') || 0, paid_in_capital: +val('m_paid') || 0,
    establish_date: val('m_date'), tax_completion_status: +val('m_tax_status') || 0,
    lawsuit_total: +val('m_lawsuit') || 0, defendant_count: +val('m_defendant') || 0,
    executed_count: +val('m_executed') || 0, executed_amount: +val('m_exec_amount') || 0,
    avg_bank_flow: +val('m_flow') || 0, avg_approved_fund: +val('m_credit_fund') || 0,
    registered_address: val('m_addr'),
    is_credit_applied: document.getElementById('m_credit_toggle').checked,
    merchant_level: val('m_level'), merchant_type: val('m_type'),
    updated_at: nowStr()
  };
  if (editId) {
    let m = db.merchants.find(x => x.merchant_id === editId);
    if (m) { Object.assign(m, data); }
    toast('客商信息已更新', 'success');
  } else {
    data.merchant_id = db.nextMerchantId++;
    data.created_at = nowStr();
    db.merchants.push(data);
    toast('客商创建成功', 'success');
  }
  saveDB(db);
  closeModal();
  renderMerchants();
}

    <div class="info-item"><span class="lbl">实缴资金</span><span class="val">${fmtMoney(m.paid_in_capital)} 元</span></div>
    <div class="info-item"><span class="lbl">实缴比例</span><span class="val">${m.registered_capital>0?fmtPct(m.paid_in_capital/m.registered_capital):'-'}</span></div>
    <div class="info-item"><span class="lbl">成立日期</span><span class="val">${m.establish_date||'-'}</span></div>
    <div class="info-item"><span class="lbl">客商层级</span><span class="val">${levelBadge(m.merchant_level||'other')}</span></div>
    <div class="info-item"><span class="lbl">客商类型</span><span class="val">${m.merchant_type==='trade'?'贸易商':m.merchant_type==='platform'?'平台公司':'一般企业'}</span></div>
    <div class="info-item"><span class="lbl">是否授信</span><span class="val">${creditBadge(m.is_credit_applied)}</span></div>
    <div class="info-item"><span class="lbl">纳税完成度</span><span class="val">${m.tax_completion_status||'-'}</span></div>
    <div class="info-item"><span class="lbl">涉诉/被告</span><span class="val">${m.lawsuit_total||0} / ${m.defendant_count||0}</span></div>
    <div class="info-item"><span class="lbl">被执行</span><span class="val">${m.executed_count||0}次 / ${fmtMoney(m.executed_amount)}元</span></div>
    <div class="info-item"><span class="lbl">银行流水/授信额度</span><span class="val">${fmtMoney(m.avg_bank_flow)} / ${fmtMoney(m.avg_approved_fund)}</span></div>
    <div class="info-item"><span class="lbl">创建时间</span><span class="val" style="font-size:12px">${m.created_at||'-'}</span></div>

// 评级准入
// ======================================================================
function showRatingModal(id) {
  let db = getDB();
  let m = db.merchants.find(x => x.merchant_id === id);
  let result = calculateScore(id);
  let dimNames = {subject_quality:'主体资质', financial:'财务情况', project_quality:'立项质量', performance_quality:'履约质量'};
  let activeDims = Object.keys(result.weights);

  let html = `<h3>评级准入 - ${m.merchant_name}</h3>`;
  
  // 评分结果
  html += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:16px;background:#f8fafc;border-radius:8px">
    <div style="text-align:center">
      <div style="font-size:12px;color:var(--muted)">准入静态分</div>
      <div style="font-size:36px;font-weight:700;color:${result.qualified?'var(--green)':'var(--red)'}">${result.total_score}</div>
    </div>
    <div>${scoreBadge(result.rating)}</div>
    <div style="color:var(--muted);font-size:13px">
      场景: ${result.scenario==='FIRST'?'首次准入':'动态履约'}<br>
      基础分: ${result.base_score} × 层级系数: ${result.level_coefficient}<br>
      风控系数: ${result.risk_coefficient}
    </div>
  </div>`;

  // 维度得分
  for (let dim of ['subject_quality','financial','project_quality','performance_quality']) {
    let score = result.dimension_scores[dim] || 0;
    let active = activeDims.includes(dim);
    let weight = result.weights[dim] || 0;
    let pct = Math.min(score, 100);
    let color = score >= 60 ? 'var(--green)' : 'var(--red)';
    html += `<div class="dimension-score">
      <span class="name">${dimNames[dim]}${active?'':' (未考核)'}${active?' '+Math.round(weight*100)+'%':''}</span>
      <div class="bar"><div style="width:${pct}%;background:${active?color:'var(--border)'}"></div></div>
      <span class="val">${active?score:'-'}</span>
    </div>`;
  }

  // 准入结果
  if (result.qualified) {
    html += `<div style="background:#dcfce7;padding:12px;border-radius:8px;margin-top:16px;color:#166534">
      <strong>准入通过</strong> — 准入静态分${result.total_score}分≥60分，可进入客商池
    </div>`;
  } else {
    html += `<div style="background:#fee2e2;padding:12px;border-radius:8px;margin-top:16px;color:#991b1b">
      <strong>准入不通过</strong> — 准入静态分${result.total_score}分<60分${m.is_credit_applied?'':'（无需授信客商可申请特批）'}
    </div>`;
  }

  html += `<div class="modal-actions">
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn ${result.qualified?'btn-success':'btn-warning'}" onclick="confirmRating(${id})">${result.qualified?'确认准入':'强制准入'}</button>
  </div>`;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function confirmRating(id) {
  let db = getDB();
  let result = calculateScore(id);
  let snapId = db.nextSnapshotId++;
  db.snapshots.push({
    id: snapId, merchant_id: id,
    total_score: result.total_score, rating: result.rating,
    risk_coefficient: result.risk_coefficient,
    base_score: result.base_score, level_coefficient: result.level_coefficient,
    scenario: result.scenario, is_credit_applied: result.is_credit_applied,
    dimension_scores: JSON.stringify(result.dimension_scores),
    qualified: result.qualified,
    created_at: nowStr()
  });
  saveDB(db);
  closeModal();
  toast('评级已确认，评级=' + result.rating + '，分数=' + result.total_score, 'success');
  navigateTo('pool');
}

        <button class="btn btn-primary btn-sm" onclick="showFinancialForm()">+ 单条录入</button>
      </div>
    </div>`;

function downloadFinancialTemplate() {
  let headers = ['客商名称','年度','季度','总资产','总负债','流动资产','流动负债','营业收入','净利润','存货','预付账款','经营现金流','净资产'];

  downloadCSV('财务数据导入模板.csv', headers, sample);
  toast('模板已下载', 'info');
}

function handleFinFile(event) {
  let file = event.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = function(e) {
    importFinancialData(e.target.result);
  };
  reader.readAsText(file, 'UTF-8');
}

function importFinancialFromPaste() {
  let text = val('finPasteArea');
  if (!text.trim()) { toast('请先粘贴数据', 'error'); return; }
  importFinancialData(text);
}

function importFinancialData(text) {
  let rows = parseDelimited(text);
  if (rows.length === 0) { toast('未解析到有效数据', 'error'); return; }
  let db = getDB();
  let success = 0, fail = 0;
  let errors = [];
  rows.forEach((row, idx) => {
    let name = row['客商名称'] || row['merchant_name'] || '';
    let m = db.merchants.find(x => x.merchant_name === name.trim());
    if (!m) {
      fail++; errors.push(`第${idx+2}行: 客商"${name}"不存在`);
      return;
    }
    let year = parseInt(row['年度'] || row['period_year']);
    if (!year) { fail++; errors.push(`第${idx+2}行: 年度无效`); return; }
    let quarter = row['季度'] || row['period_quarter'] || '';
    quarter = quarter.toString().replace('Q', '').trim();
    let q = quarter ? parseInt(quarter) : null;
    let data = {
      merchant_id: m.merchant_id, period_year: year, period_quarter: q,
      total_asset: +(row['总资产']||0), total_liability: +(row['总负债']||0),
      current_asset: +(row['流动资产']||0), current_liability: +(row['流动负债']||0),
      revenue: +(row['营业收入']||0), net_profit: +(row['净利润']||0),
      inventory: +(row['存货']||0), prepay: +(row['预付账款']||0),
      operating_cash_flow: +(row['经营现金流']||0), net_asset: +(row['净资产']||0),
      created_at: nowStr()
    };
    let existing = db.financial.findIndex(f => f.merchant_id === m.merchant_id && f.period_year === year && (f.period_quarter||null) === (q||null));
    if (existing >= 0) db.financial[existing] = data;
    else db.financial.push(data);
    success++;
  });
  saveDB(db);
  toast(`导入完成: 成功${success}条, 失败${fail}条`, success > 0 ? 'success' : 'error');
  if (errors.length > 0) console.log('导入错误:', errors);
  renderFinancial();
}

function saveFinancial() {
  let db = getDB();
  let mid = +val('f_merchant');
  let year = +val('f_year');
  if (!mid || !year) { toast('客商和年度必填', 'error'); return; }
  let q = val('f_quarter');
  let data = {
    merchant_id: mid, period_year: year, period_quarter: q ? +q : null,
    total_asset: +val('f_ta')||0, total_liability: +val('f_tl')||0,
    current_asset: +val('f_ca')||0, current_liability: +val('f_cl')||0,
    revenue: +val('f_rev')||0, net_profit: +val('f_np')||0,
    inventory: +val('f_inv')||0, prepay: +val('f_pp')||0,
    operating_cash_flow: +val('f_ocf')||0, net_asset: +val('f_na')||0,
    created_at: nowStr()
  };
  let existing = db.financial.findIndex(f => f.merchant_id === mid && f.period_year === year && (f.period_quarter||null) === (data.period_quarter||null));
  if (existing >= 0) { db.financial[existing] = data; toast('财务数据已更新', 'success'); }

  let m = db.merchants.find(x => x.merchant_id === mid);

  saveDB(db);

  renderFinancial();

function deleteFinancial(mid, year, quarter) {
  if (!confirm('确认删除该条财务数据？')) return;
  let db = getDB();
  db.financial = db.financial.filter(f => !(f.merchant_id === mid && f.period_year === year && (f.period_quarter||'') === (quarter||'')));
  saveDB(db);
  toast('已删除', 'success');
  renderFinancial();
}

    <div style="margin-top:8px"><textarea class="import-textarea" id="perfPasteArea" placeholder="从Excel粘贴数据（含表头）&#n;格式：客商名称,年度营收,历史逾期金额,项目总数,逾期项目数,总批次,逾期60天批次,已清收金额"></textarea></div>
    <button class="btn btn-success btn-sm" style="margin-top:8px" onclick="importPerfFromPaste()">导入粘贴数据</button>
  </div>`;

  // 数据列表
  html += `<table><thead><tr><th>客商名称</th><th>年度营收</th><th>历史逾期金额</th><th>项目总数</th><th>逾期项目</th><th>逾期60天批次</th><th>已清收金额</th><th>操作</th></tr></thead><tbody>`;
  db.performance_quality.forEach(p => {
    let m = db.merchants.find(x => x.merchant_id === p.merchant_id);
    html += `<tr>
      <td>${m?m.merchant_name:'(已删除)'}</td>
      <td>${fmtMoney(p.annual_revenue)}</td><td>${fmtMoney(p.historical_overdue_amount)}</td>
      <td>${p.total_project_count||0}</td><td>${p.overdue_project_count||0}</td>
      <td>${p.overdue_60days_batch_count||0}/${p.total_batch_count||0}</td><td>${fmtMoney(p.recovered_amount||0)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="showPerfForm(${p.merchant_id})">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deletePerf(${p.merchant_id})">删除</button></td>
    </tr>`;
  });
  if (db.performance_quality.length === 0) html += '<tr><td colspan="8" class="empty">暂无履约质量数据</td></tr>';
  html += `</tbody></table></div>`;
  document.getElementById('view-performance').innerHTML = html;
}

function downloadPerfTemplate() {
  let headers = ['客商名称','年度营收','历史逾期金额','项目总数','逾期项目数','总批次','逾期60天批次','已清收金额'];
  let sample = ['深圳市宏远科技有限公司','150000000','0','10','0','50','0','0'];
  downloadCSV('履约质量数据导入模板.csv', headers, sample);
  toast('模板已下载', 'info');
}

function handlePerfFile(event) {
  let file = event.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = e => importPerfData(e.target.result);
  reader.readAsText(file, 'UTF-8');
}

function importPerfFromPaste() {
  let text = val('perfPasteArea');
  if (!text.trim()) { toast('请先粘贴数据', 'error'); return; }
  importPerfData(text);
}

function importPerfData(text) {
  let rows = parseDelimited(text);
  if (rows.length === 0) { toast('未解析到有效数据', 'error'); return; }
  let db = getDB();
  let success = 0, fail = 0;
  rows.forEach(row => {
    let name = row['客商名称'] || '';
    let m = db.merchants.find(x => x.merchant_name === name.trim());
    if (!m) { fail++; return; }
    let data = {
      merchant_id: m.merchant_id,
      annual_revenue: +(row['年度营收']||0),
      historical_overdue_amount: +(row['历史逾期金额']||0),
      total_project_count: +(row['项目总数']||0),
      overdue_project_count: +(row['逾期项目数']||0),
      total_batch_count: +(row['总批次']||0),
      overdue_60days_batch_count: +(row['逾期60天批次']||0),
      recovered_amount: +(row['已清收金额']||0),
      created_at: nowStr()
    };
    let existing = db.performance_quality.findIndex(p => p.merchant_id === m.merchant_id);
    if (existing >= 0) db.performance_quality[existing] = data;
    else db.performance_quality.push(data);
    success++;
  });
  saveDB(db);
  toast(`导入完成: 成功${success}条, 失败${fail}条`, success > 0 ? 'success' : 'error');
  renderPerformance();
}

function showPerfForm(merchantId) {
  let db = getDB();
  let existing = merchantId ? db.performance_quality.find(p => p.merchant_id === merchantId) : null;
  let m = merchantId ? db.merchants.find(x => x.merchant_id === merchantId) : null;
  let html = `<h3>${existing?'编辑':'录入'}履约质量数据${m?' - '+m.merchant_name:''}</h3>
  <div class="form-group"><label>客商 *</label>
    <select id="pf_merchant">${db.merchants.map(x => `<option value="${x.merchant_id}" ${merchantId===x.merchant_id?'selected':''}>${x.merchant_name}</option>`).join('')}</select>
  </div>
  <div class="form-row">
    <div class="form-group"><label>年度营收（元）</label><input id="pf_rev" type="number" value="${existing?existing.annual_revenue:0}" placeholder="上一年度与公司累计营收"></div>
    <div class="form-group"><label>历史逾期总金额</label><input id="pf_overdue" type="number" value="${existing?existing.historical_overdue_amount:0}"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>项目总数</label><input id="pf_total_proj" type="number" value="${existing?existing.total_project_count||0:0}"></div>
    <div class="form-group"><label>首次逾期项目数</label><input id="pf_overdue_proj" type="number" value="${existing?existing.overdue_project_count||0:0}"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>总批次</label><input id="pf_total_batch" type="number" value="${existing?existing.total_batch_count||0:0}"></div>
    <div class="form-group"><label>逾期超60天批次数</label><input id="pf_overdue_batch" type="number" value="${existing?existing.overdue_60days_batch_count||0:0}"></div>
  </div>
  <div class="form-group"><label>已清收金额</label><input id="pf_recovered" type="number" value="${existing?existing.recovered_amount||0:0}" placeholder="年度已完成清收总金额"></div>
  <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="savePerf()">保存</button></div>`;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function savePerf() {
  let db = getDB();
  let mid = +val('pf_merchant');
  if (!mid) { toast('请选择客商', 'error'); return; }
  let data = {
    merchant_id: mid,
    annual_revenue: +val('pf_rev')||0,
    historical_overdue_amount: +val('pf_overdue')||0,
    total_project_count: +val('pf_total_proj')||0,
    overdue_project_count: +val('pf_overdue_proj')||0,
    total_batch_count: +val('pf_total_batch')||0,
    overdue_60days_batch_count: +val('pf_overdue_batch')||0,
    recovered_amount: +val('pf_recovered')||0,
    created_at: nowStr()
  };
  let existing = db.performance_quality.findIndex(p => p.merchant_id === mid);
  if (existing >= 0) { db.performance_quality[existing] = data; toast('履约质量数据已更新', 'success'); }
  else { db.performance_quality.push(data); toast('履约质量数据保存成功', 'success'); }
  let m = db.merchants.find(x => x.merchant_id === mid);
  if (m) m.updated_at = nowStr();
  saveDB(db);
  closeModal();
  renderPerformance();
}

function deletePerf(mid) {
  if (!confirm('确认删除该条履约质量数据？')) return;
  let db = getDB();
  db.performance_quality = db.performance_quality.filter(p => p.merchant_id !== mid);
  saveDB(db);
  toast('已删除', 'success');
  renderPerformance();
}

// ======================================================================
// 客商池看板
// ======================================================================
let poolFilter = {rating: '', level: '', credit: '', sort: 'score_desc'};

function renderPool() {
  let db = getDB();
  let snapshots = db.snapshots.slice();

  // 筛选
  if (poolFilter.rating) snapshots = snapshots.filter(s => s.rating === poolFilter.rating);
  if (poolFilter.level) {
    snapshots = snapshots.filter(s => {
      let m = db.merchants.find(x => x.merchant_id === s.merchant_id);
      return m && (m.merchant_level || 'other') === poolFilter.level;
    });
  }
  if (poolFilter.credit) {
    let needCredit = poolFilter.credit === 'true';
    snapshots = snapshots.filter(s => {
      let m = db.merchants.find(x => x.merchant_id === s.merchant_id);
      return m && !!m.is_credit_applied === needCredit;
    });
  }

  // 排序
  if (poolFilter.sort === 'score_desc') snapshots.sort((a,b) => b.total_score - a.total_score);
  else if (poolFilter.sort === 'score_asc') snapshots.sort((a,b) => a.total_score - b.total_score);
  else if (poolFilter.sort === 'time_desc') snapshots.sort((a,b) => (b.id - a.id));

  let qualified = snapshots.filter(s => s.rating !== 'UNQUALIFIED').length;
  let avgScore = snapshots.length > 0 ? Math.round(snapshots.reduce((sum,s) => sum + s.total_score, 0) / snapshots.length * 100) / 100 : 0;

  let html = `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">客商池总数</div><div class="value">${snapshots.length}</div><div class="sub">已评级客商</div></div>
    <div class="stat-card"><div class="label">准入通过</div><div class="value" style="color:var(--green)">${qualified}</div><div class="sub">评级≥60分</div></div>
    <div class="stat-card"><div class="label">准入不通过</div><div class="value" style="color:var(--red)">${snapshots.length - qualified}</div><div class="sub">评级<60分</div></div>
    <div class="stat-card"><div class="label">平均分</div><div class="value" style="color:var(--primary)">${avgScore}</div><div class="sub">准入静态分均值</div></div>
  </div>

  <div class="card">
    <div class="card-header"><h3>客商池</h3></div>
    <div class="filter-bar">
      <select id="filter_rating" onchange="poolFilter.rating=this.value;renderPool()">
        <option value="">全部评级</option>
        <option value="AAA" ${poolFilter.rating==='AAA'?'selected':''}>AAA</option>
        <option value="AA" ${poolFilter.rating==='AA'?'selected':''}>AA</option>
        <option value="A" ${poolFilter.rating==='A'?'selected':''}>A</option>
        <option value="BBB" ${poolFilter.rating==='BBB'?'selected':''}>BBB</option>
        <option value="BB" ${poolFilter.rating==='BB'?'selected':''}>BB</option>
        <option value="B" ${poolFilter.rating==='B'?'selected':''}>B</option>
        <option value="UNQUALIFIED" ${poolFilter.rating==='UNQUALIFIED'?'selected':''}>不合格</option>
      </select>
      <select id="filter_level" onchange="poolFilter.level=this.value;renderPool()">
        <option value="">全部层级</option>
        <option value="strategic" ${poolFilter.level==='strategic'?'selected':''}>战略层</option>
        <option value="core" ${poolFilter.level==='core'?'selected':''}>核心层</option>
        <option value="standard" ${poolFilter.level==='standard'?'selected':''}>标准层</option>
        <option value="other" ${poolFilter.level==='other'?'selected':''}>其他</option>
      </select>
      <select id="filter_credit" onchange="poolFilter.credit=this.value;renderPool()">
        <option value="">全部类型</option>
        <option value="true" ${poolFilter.credit==='true'?'selected':''}>需授信</option>
        <option value="false" ${poolFilter.credit==='false'?'selected':''}>无需授信</option>
      </select>
      <select id="filter_sort" onchange="poolFilter.sort=this.value;renderPool()">
        <option value="score_desc" ${poolFilter.sort==='score_desc'?'selected':''}>分数从高到低</option>
        <option value="score_asc" ${poolFilter.sort==='score_asc'?'selected':''}>分数从低到高</option>
        <option value="time_desc" ${poolFilter.sort==='time_desc'?'selected':''}>最近评级</option>
      </select>
    </div>
    <table><thead><tr><th>排名</th><th>客商名称</th><th>准入分</th><th>评级</th><th>场景</th><th>授信</th><th>层级</th><th>风控系数</th><th>评级时间</th><th>操作</th></tr></thead><tbody>`;
  snapshots.forEach((s, idx) => {
    let m = db.merchants.find(x => x.merchant_id === s.merchant_id);
    html += `<tr>
      <td>${idx+1}</td>
      <td>${m?m.merchant_name:'(已删除)'}</td>
      <td style="font-weight:700;color:${s.rating!=='UNQUALIFIED'?'var(--green)':'var(--red)'}">${s.total_score}</td>
      <td>${scoreBadge(s.rating)}</td>
      <td>${s.scenario==='FIRST'?'首次':'动态'}</td>
      <td>${creditBadge(s.is_credit_applied)}</td>
      <td>${m?levelBadge(m.merchant_level||'other'):'-'}</td>
      <td>${s.risk_coefficient}</td>
      <td style="font-size:11px;color:var(--muted)">${s.created_at}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="showMerchantDetail(${s.merchant_id})">详情</button>
        <button class="btn btn-primary btn-sm" onclick="showRatingModal(${s.merchant_id})">重新评级</button>
      </td>
    </tr>`;
  });
  if (snapshots.length === 0) html += '<tr><td colspan="10" class="empty">客商池暂无数据，请先到客商管理进行评级</td></tr>';
  html += `</tbody></table></div>`;
  document.getElementById('view-pool').innerHTML = html;
}

// ======================================================================
// 导航 & 初始化
// ======================================================================
function navigateTo(view) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  let navEl = document.querySelector('[data-view="' + view + '"]');
  if (navEl) navEl.classList.add('active');
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  let contentEl = document.getElementById('view-' + view);
  if (contentEl) contentEl.classList.add('active');
  const titles = {dashboard:'系统看板', merchants:'客商管理', financial:'财务数据', project:'立项质量', performance:'履约质量', pool:'客商池看板'};
  document.getElementById('pageTitle').textContent = titles[view] || '';
  const renderers = {dashboard:renderDashboard, merchants:renderMerchants, financial:renderFinancial, project:renderProject, performance:renderPerformance, pool:renderPool};
  if (renderers[view]) renderers[view]();
}

document.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => navigateTo(n.dataset.view));
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
navigateTo('dashboard');
</script>
